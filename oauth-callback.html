<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connecting YouTube…</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f;
    color: #eee;
  }
  .box { text-align: center; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #333;
    border-top-color: #ff4d4d;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 15px; color: #ccc; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg">Connecting your YouTube account…</div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');
      var state = params.get('state');

      var msgEl = document.getElementById('msg');
      var spinnerEl = document.getElementById('spinner');

      function finish(payload) {
        // Send result back to the window that opened this popup
        if (window.opener) {
          window.opener.postMessage(
            Object.assign({ source: 'youtube-oauth-callback' }, payload),
            window.location.origin
          );
        }
        spinnerEl.style.display = 'none';
      }

      if (error) {
        msgEl.textContent = 'Access was not granted (' + error + '). You can close this window.';
        msgEl.classList.add('error');
        finish({ success: false, error: error });
      } else if (code) {
        msgEl.textContent = 'Connected! This window will close automatically…';
        finish({ success: true, code: code, state: state });
        setTimeout(function () { window.close(); }, 1200);
      } else {
        msgEl.textContent = 'No authorization code received. You can close this window.';
        msgEl.classList.add('error');
        finish({ success: false, error: 'no_code' });
      }

      // Fallback: if window.close() is blocked (some browsers block it
      // unless the window was opened via window.open), leave the message up.
    })();
  </script>
</body>
</html>
